<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reporting HSE — CM3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plane:#eef2f7; --surface:#ffffff; --surface2:#f7f9fc; --surface3:#eaf1f8;
  --ink:#0f1c30; --ink2:#48586e; --faint:#8a99ab;
  --line:#dde5ee; --line2:#c3d1e0;
  --marine:#003A6E; --marine2:#0a2a52; --navy:#0a1830;
  --cyan:#1180c4; --bleu:#2a78d6; --accent:#E8720C; --accent2:#c25c07;
  --ok:#0f9d58; --mid:#e0a000; --warn:#d03b3b; --violet:#4a3aa7;
  --ok-bg:#e7f6ee; --mid-bg:#fdf3dc; --warn-bg:#fbe9e9; --info-bg:#e8f1fb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#4a3aa7;
  --r:14px; --sh:0 1px 2px rgba(15,28,48,.06),0 6px 18px rgba(15,28,48,.07);
  --sh2:0 2px 6px rgba(15,28,48,.09),0 12px 30px rgba(15,28,48,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--plane)}
body{font-family:"Barlow","Segoe UI",-apple-system,Roboto,Arial,sans-serif;color:var(--ink);
  background:var(--plane);-webkit-text-size-adjust:100%;min-height:100vh;padding-bottom:84px;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ------------- Header ------------- */
header{background:linear-gradient(135deg,var(--marine),var(--marine2));color:#fff;padding:9px 16px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:25;flex-wrap:wrap;
  box-shadow:0 2px 14px rgba(0,40,80,.22)}
.logo{width:56px;height:34px;flex:none;background:#fff;border-radius:7px;padding:4px 5px;display:grid;place-items:center}
.logo svg{width:100%;height:100%;display:block}
.htit{margin-right:auto;min-width:140px}
.htit h1{font-size:16.5px;letter-spacing:.5px;text-transform:uppercase;line-height:1.1}
.htit small{display:block;font-size:11.5px;color:#a8c4de;font-weight:600}
.selgrp{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:3px;gap:2px}
.selgrp button{background:none;border:0;color:#cfe0ef;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s}
.selgrp button[aria-pressed="true"]{background:#fff;color:var(--marine)}
.hsel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:6px 10px;font-weight:600;font-size:13px}
.hsel option{color:#111}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;padding:7px 12px;
  border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn.on{background:var(--accent);border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:#8aa5bd;flex:none}
.dot.ok{background:#4ade80}.dot.warn{background:#fbbf24}.dot.err{background:#f87171}

/* ------------- Tabs ------------- */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;scrollbar-width:none;
  box-shadow:0 -2px 14px rgba(15,28,48,.07)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-width:84px;background:none;border:0;padding:8px 6px 7px;font-size:10.5px;
  color:var(--faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-weight:600}
nav.tabs button .ic{font-size:18px;line-height:1.1}
nav.tabs button.on{color:var(--marine);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:16%;right:16%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* ------------- Layout ------------- */
main{max-width:1240px;margin:0 auto;padding:16px 14px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:16px;margin-bottom:14px;animation:rise .3s both}
.card>h2{font-size:15px;margin-bottom:3px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--marine)}
.card>h2 .bar{width:4px;height:16px;border-radius:3px;background:var(--accent);flex:none}
.card.c-b>h2 .bar{background:var(--bleu)} .card.c-r>h2 .bar{background:var(--warn)}
.card.c-v>h2 .bar{background:var(--violet)} .card.c-g>h2 .bar{background:var(--ok)}
.card.c-o>h2 .bar{background:var(--accent)}
.card.c-rose>h2 .bar{background:#d4479b}
.card.c-jaune>h2 .bar{background:#d9a400}
.card>p.sub{margin:0 0 14px;color:var(--ink2);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(var(--min,220px),1fr))}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* ------------- KPI ------------- */
.kpigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;position:relative}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);font-weight:700;line-height:1.25;min-height:28px;display:flex;align-items:center;justify-content:center;padding:0 20px;text-align:center}
.kpi .v{font-family:"Barlow Condensed",Arial;font-size:33px;font-weight:700;line-height:1.05;margin-top:2px;color:var(--ink)}
.kpi .s{font-size:11.5px;color:var(--ink2);margin-top:2px}
.kpi.good{background:var(--ok-bg);border-color:#bfe6d1} .kpi.good .v{color:#0b7c45}
.kpi.mid{background:var(--mid-bg);border-color:#f0dcac} .kpi.mid .v{color:#946a00}
.kpi.bad{background:var(--warn-bg);border-color:#f0c4c4} .kpi.bad .v{color:#b02c2c}
.kpi .pic{position:absolute;top:8px;right:8px}
.hero{background:linear-gradient(135deg,var(--marine),#0d3a70);color:#fff;border-radius:var(--r);padding:15px;text-align:center;box-shadow:var(--sh2)}
.hero .v{font-family:"Barlow Condensed",Arial;font-size:60px;font-weight:700;line-height:.95}
.hero .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:#bcd6ec;font-weight:700}
.hero .s{font-size:12px;color:#a8c4de;margin-top:4px}
.delta{font-size:11.5px;font-weight:700}
.delta.up{color:var(--warn)} .delta.down{color:#0b7c45} .delta.flat{color:var(--faint)}

/* ------------- Jauge ------------- */
.gaugebox{text-align:center}
.gauge{width:102px;height:102px;margin:0 auto;display:block}
.gauge .gbg{fill:none;stroke:#e6ecf3;stroke-width:9}
.gauge .gfg{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .6s}
.gauge .gfg.c-ok{stroke:var(--ok)} .gauge .gfg.c-mid{stroke:var(--mid)} .gauge .gfg.c-bad{stroke:var(--warn)} .gauge .gfg.c-neutre{stroke:var(--bleu)}
.gauge text{fill:var(--ink);font-family:"Barlow Condensed",Arial;font-weight:700}

/* ------------- Tables ------------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface3);color:var(--marine);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:2}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tbody tr:hover td{background:#f4f8fd}
tfoot td{font-weight:700;background:var(--surface3)!important;border-top:2px solid var(--line2);border-bottom:0}
td input,td select{width:100%;min-width:60px;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:7px;text-align:right;font-variant-numeric:tabular-nums}
td input:hover,td select:hover{border-color:var(--line2)}
td input:focus,td select:focus{outline:none;border-color:var(--bleu);background:#fff;box-shadow:0 0 0 3px rgba(42,120,214,.15)}
td input:disabled{color:var(--ink);opacity:1}
th.grp{text-align:center;color:#fff;letter-spacing:.6px}
th.grp.b{background:#2a78d6} th.grp.o{background:#c9560a} th.grp.g{background:#12855f}
th.grp.v{background:#4a3aa7} th.grp.r{background:#b02c2c} th.grp.m{background:var(--marine)}
tr.cur td{background:#fff8e9!important;box-shadow:inset 3px 0 0 var(--accent)}

/* ------------- Boutons / formulaires ------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;line-height:1;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--marine);color:#fff}
.btn-primary:hover{background:#0d3a70}
.btn-ghost{background:#fff;color:var(--marine);border-color:var(--line2)}
.btn-ghost:hover{background:var(--surface3)}
.btn-warn{background:var(--warn);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icobtn{background:none;border:1px solid transparent;border-radius:8px;padding:3px 6px;cursor:pointer;font-size:15px;line-height:1;color:var(--faint)}
.icobtn:hover{background:var(--warn-bg);border-color:#f0c4c4;color:var(--warn)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--bleu);box-shadow:0 0 0 3px rgba(42,120,214,.15)}
.field .hint{font-size:11.5px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid}
.pill.sante{background:#e7f6ee;color:#0b7c45;border-color:#bfe6d1}
.pill.secu{background:#e8f1fb;color:#1b4f8f;border-color:#c3daf5}
.pill.env{background:#eef7e6;color:#3d6b1c;border-color:#cfe6b8}
.pill.sys{background:#f0edfa;color:#4a3aa7;border-color:#d6cff0}
.pill.res{background:#fdeee5;color:#a3401a;border-color:#f7d5c1}
.pill.suivi{background:#eef2f7;color:#3d4b63;border-color:var(--line2)}
.note{background:var(--mid-bg);border:1px solid #f0dcac;border-left:4px solid var(--mid);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;color:#6d5000}
.note>b:first-child{display:block;margin-bottom:3px}
.note.info{background:var(--info-bg);border-color:#c3daf5;border-left-color:var(--bleu);color:#1b4f8f}
.empty{color:var(--faint);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:10px}
.editonly{display:none} body.edit .editonly{display:revert}
figcaption{font-size:13.5px;font-weight:700;margin-bottom:2px;color:var(--ink)}
.figsub{font-size:12px;color:var(--ink2);margin-bottom:9px}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0 2px;align-items:center}
.note.danger{background:var(--warn-bg);border-color:#f0c4c4;border-left:4px solid var(--warn)}
.note.danger b{color:#9a2222}
.qsel{display:inline-flex;align-items:center;gap:6px}
.qsel b{color:var(--ink)}
.qsel select.qana{border:1px solid var(--line2);border-radius:8px;padding:4px 8px;background:#fff;font:inherit;font-size:12px;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;flex:none}
svg .grid line{stroke:#e8edf3}
svg text{font-family:"Barlow",sans-serif;font-size:11px}
svg text:not([style*="fill"]){fill:#6b7a8d}
svg text.dl:not([style*="fill"]){fill:var(--ink)}
svg text.dl{font-weight:700;font-size:10.5px}
svg .target{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.tipbox{position:fixed;pointer-events:none;background:var(--navy);color:#fff;padding:8px 11px;border-radius:9px;
  font-size:12.5px;line-height:1.4;z-index:100;opacity:0;transition:opacity .1s;box-shadow:var(--sh2);max-width:270px}
.tipbox .k{color:#9fd8f5}
.modal{position:fixed;inset:0;background:rgba(15,28,48,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:20px;box-shadow:var(--sh2)}
.sheet h3{font-size:16px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--marine)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(18px);background:var(--navy);color:#fff;
  padding:10px 16px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:92%;text-align:center;box-shadow:var(--sh2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ------------- Visionneuse certificat ------------- */
#viewer{position:fixed;inset:0;background:rgba(10,24,48,.9);z-index:90;display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer .vbar{display:flex;gap:8px;padding:10px 14px;align-items:center;color:#fff;flex-wrap:wrap}
#viewer .vbar b{margin-right:auto;font-size:14px}
#viewer .vstage{flex:1;overflow:auto;display:grid;place-items:center;padding:10px;cursor:grab}
#viewer .vstage.drag{cursor:grabbing}
#viewer img{max-width:none;transform-origin:center center;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#viewer .vbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px}
#viewer .vbtn:hover{background:rgba(255,255,255,.26)}
.certthumb{display:block;width:100%;max-width:150px;margin:8px auto 0;border:1px solid var(--line2);border-radius:8px;cursor:zoom-in;background:#fff}
.certthumb:hover{box-shadow:var(--sh2)}

/* ------------- Pictogrammes ------------- */
.smi{width:30px;height:30px;border:0;background:none;cursor:pointer;padding:0;display:inline-grid;place-items:center;border-radius:50%;transition:.15s}
.smi:hover{background:var(--surface3)}
.smi svg{display:block}
body:not(.edit) .smi{cursor:default}
.objtbl td{white-space:normal;vertical-align:top}
.objtbl td.c{white-space:nowrap;text-align:center}
.objtbl textarea{width:100%;min-width:150px;background:#fff;border:1px solid transparent;border-radius:8px;font-size:12.5px;padding:5px 7px;resize:vertical}
.objtbl textarea:hover{border-color:var(--line2)}
.objtbl textarea:focus{outline:none;border-color:var(--bleu);box-shadow:0 0 0 3px rgba(42,120,214,.15)}
.objtbl th.qcur,.objtbl td.qcur{background:#fff8e9}
.objtbl th.qcur{background:#f3c98a;color:#5c3a00}
.bz{fill:#e8eef5;stroke:#b9c8da;stroke-width:1;cursor:pointer;transition:.15s}
.bz:hover{fill:#cfe0f0}
.bz.hit{stroke:var(--warn);stroke-width:1.6}

/* ------------- Bulletin (trame CM3) ------------- */
.bulwrap{background:#fff;color:#111;border-radius:10px;padding:8px;overflow:auto}
.bulletin{width:1040px;margin:0 auto;font-family:"Calibri","Barlow",Arial,sans-serif;color:#111;background:#fff}
.bul-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bul-logo{width:130px;flex:none;display:grid;place-items:center}
.bul-logo svg,.bul-logo img{width:100%;max-height:60px}
.bul-band{flex:1;background:linear-gradient(90deg,#9dc3e6,#bdd7ee 55%,#deebf7);
  clip-path:polygon(26px 0,100% 0,calc(100% - 26px) 100%,0 100%);padding:8px 40px;text-align:center}
.bul-band .t1{font-size:23px;font-weight:700;font-style:italic;color:#1f3864;line-height:1.1}
.bul-band .t2{font-size:19px;font-weight:700;font-style:italic;color:#1f3864}
.bul-per{width:150px;flex:none;text-align:right;font-size:19px;font-weight:700;font-style:italic;color:#1f3864}
.bul-r1{display:grid;grid-template-columns:1.25fr .85fr 1.1fr;gap:8px;margin-bottom:8px}
.bx{border:3px solid #000;border-radius:12px;padding:7px 11px;min-height:96px}
.bx.red{border-color:#e00000} .bx.blk{border-color:#000} .bx.grn{border-color:#00a650}
.bx h4{text-align:center;font-size:14px;font-weight:700;text-decoration:underline;margin-bottom:5px}
.bx.red h4{color:#c00000} .bx.grn h4{color:#00a650}
.bx ul{margin:0;padding-left:6px;list-style:none}
.bx li{font-size:13px;margin-bottom:3px;padding-left:16px;position:relative;line-height:1.28}
.bx li::before{content:"❖";position:absolute;left:0;font-size:11px;top:1px}
.bul-r2{display:grid;grid-template-columns:1.02fr 1fr;gap:8px;margin-bottom:8px}
.bul-r3{display:grid;grid-template-columns:1.02fr 1fr;gap:8px}
.panel{border:2.5px solid #000;border-radius:10px;padding:8px 10px;position:relative;background:#fff}
.panel h5{text-align:center;font-size:14px;font-weight:700;color:#1f3864;margin:0 0 4px;padding-left:52px}
.panel .smiley{position:absolute;left:8px;top:8px;width:46px;height:46px}
.bul-tbl{width:100%;border-collapse:collapse;font-size:12px}
.bul-tbl td,.bul-tbl th{border:1px solid #7f7f7f;padding:3px 5px;text-align:center;color:#111;white-space:nowrap;background:#fff}
.bul-tbl th{background:#f2f2f2;font-weight:700;font-size:12px;text-transform:none;letter-spacing:0;position:static}
.bul-tbl td.lab{text-align:left;background:#ffff99;font-weight:600;font-size:11.5px}
.bul-tbl td.lab small{font-weight:400;font-size:10.5px}
.bul-tbl td.z{background:#ccffcc;font-weight:700}
.bul-tbl td.nz{background:#ff0000;color:#fff;font-weight:700}
.bul-tbl td.hi{background:#dbeef4;font-weight:700}
.bul-tbl td.tx{background:#fcd5b4;text-align:left;font-weight:600;font-size:11.5px}
.bul-note{font-size:14px;font-weight:700;font-style:italic;color:#c00000;text-align:center;margin-top:20px}
.bul-note u{color:#111;font-style:normal;display:block;margin-bottom:12px;font-size:15px}
.bul-foot{margin-top:8px;font-size:10.5px;color:#555;display:flex}
.bulletin svg text{fill:#444} .bulletin svg text.dl{fill:#111}
.bulletin svg .grid line{stroke:#ddd} .bulletin svg .target{stroke:#808080}

@media print{
  @page{size:A4 landscape;margin:6mm}
  html,body{background:#fff!important;padding:0;color:#111}
  header,nav.tabs,.noprint,#toast{display:none!important}
  main{padding:0;max-width:none}
  .card{border:0!important;box-shadow:none!important;padding:0;margin:0;background:#fff!important}
  .bulwrap{padding:0;border-radius:0;overflow:visible}
  .bulletin{width:100%}
  .bulletin .bx{min-height:88px;padding:6px 10px}
  .bulletin .bx li{font-size:12px;margin-bottom:2px}
  .bulletin .panel{padding:6px 9px}
  .bulletin .bul-tbl td,.bulletin .bul-tbl th{padding:2px 4px;font-size:11px}
  .bulletin .bul-head{margin-bottom:5px}
  .bulletin .bul-r1,.bulletin .bul-r2{margin-bottom:6px}
  .pagebreak{break-before:page}
  .prt table{font-size:9.5px;border-collapse:collapse}
  .prt th,.prt td{border:1px solid #bbb;padding:3px 4px}
  .prt th{background:#e8eef5!important;color:#111!important}
}
@media (max-width:960px){ .g4{grid-template-columns:repeat(2,1fr)} }
@media (max-width:700px){
  header{padding:8px 12px}
  .htit{width:100%;margin-right:0}
  main{padding:12px 10px 6px}
  .card{padding:13px}
  .hero .v{font-size:46px}
  .g4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="logo" id="hlogo"></div>

function months(seed){

}

function deepMerge(base,over){
  if(Array.isArray(base)) return Array.isArray(over)? over : base;
  if(base && typeof base==="object"){
    const out=Object.assign({},base);
    if(over && typeof over==="object") for(const k of Object.keys(over)) out[k]=deepMerge(base[k],over[k]);
    return out;
  }
  return (over===undefined)? base : over;
}

const n=v=>(typeof v==="number"&&isFinite(v))?v:(parseFloat(v)||0);
function sum(a,f){ return a.reduce((x,b)=>x+n(f(b)),0); }
function actifs(ms){ return ms.filter(m=>n(m.h)>0||n(m.eff)>0); }
function rates(h,ataa,atsa,jours){
  h=n(h);
  return {tf1:h? n(ataa)*1e6/h:0, tf2:h? (n(ataa)+n(atsa))*1e6/h:0, tg:h? n(jours)*1e3/h:0};
}
/* Effectif concerné par les remontées = effectif du mois − dirigeants */
function concernes(m){ return Math.max(0, n(m.eff)-n(DB.settings.dirigeants)); }

/* totals(year, mIdx) — mIdx null = année entière, sinon index 0-11 */
function totals(year, mIdx){
  const y=DB.years[year]; if(!y) return null;
  const all=y.months, ms=(mIdx==null)? all : [all[mIdx]];
  const act=actifs(ms), x=y.extras;
  const S=f=>sum(ms,f);
  const t={
    periode:(mIdx==null)?"année":MOIS[mIdx],
    eff:act.length? sum(act,m=>m.eff)/act.length:0,
    h:S(m=>m.h), hI:S(m=>m.hI), etpI:act.length? sum(act,m=>m.etpI)/act.length:0,
    ataa:S(m=>m.ataa), atsa:S(m=>m.atsa), ben:S(m=>m.ben), traj:S(m=>m.traj), mort:S(m=>m.mort),
    jours:S(m=>m.jours), mp:S(m=>m.mp), atI:S(m=>m.atI), atST:S(m=>m.atST),
    vigR:S(m=>m.vigR), rem:S(m=>m.rem),
    qhpN:S(m=>m.qhpN), qhpP:S(m=>m.qhpP),
    thS:S(m=>m.thS), thSe:S(m=>m.thSe), thE:S(m=>m.thE),
    na:S(m=>m.na), acc:S(m=>m.acc), vms:S(m=>m.vms), vmsR:S(m=>m.vmsR),
    aud:S(m=>m.aud), nc:S(m=>m.nc), sanc:S(m=>m.sanc),
    form:S(m=>m.form), pdp:S(m=>m.pdp), proto:S(m=>m.proto), evalP:S(m=>m.evalP), bfc:S(m=>m.bfc),
    flash:S(m=>m.flash), nbMois:act.length
  };
  Object.assign(t, rates(t.h,t.ataa,t.atsa,t.jours));
  let den=0,num=0;
  ms.forEach(m=>{ if(n(m.qhpN)>0){ den+=(n(m.qhpE)||n(m.eff))*n(m.qhpN); num+=n(m.qhpP); } });
  t.qhpTaux=den? num/den*100:0;
  /* Remontées : cible = 3 par collaborateur concerné et par an */
  const actAll=actifs(all);
  t.concernes = actAll.length? sum(actAll,concernes)/actAll.length : 0;
  t.remCibleAn = t.concernes * n(DB.settings.remParPers);
  const part = (mIdx==null)? 1 : (actAll.length? 1/12 : 0);
  t.remCible = (mIdx==null)? t.remCibleAn : t.remCibleAn/12;
  t.remTaux = t.remCible? t.rem/t.remCible*100 : 0;
  /* Diversité des thèmes : nombre de domaines couverts sur la période */
  t.themes = t.thS+t.thSe+t.thE;
  t.diversite = [t.thS,t.thSe,t.thE].filter(v=>v>0).length;
  t.diversiteTaux = t.diversite/3*100;
  const pa=ms.map(m=>n(m.pa)).filter(v=>v>0); t.pa=pa.length? pa[pa.length-1]:0;
  t.evts=t.ataa+t.atsa+t.ben+t.traj+t.mort;
  t.accTaux = t.na? t.acc/t.na*100 : (t.acc?100:0);
  t.formNb   = (mIdx==null && n(x.formTotal))? n(x.formTotal) : t.form;   // total manuel s'il est saisi, sinon somme du détail
  t.formTaux = 0;                       // plus de plan de formation chiffré dans le classeur
  t.vgpTaux  = n(x.vgpPct);
  /* Avancement annuel du programme SSE : moyenne des composantes renseignées,
     chacune plafonnée à 100 % et rapportée à sa cible proratisée quand elle est cumulative. */
  (function(){
    const P=prorata(year), comps=[];
    const add=(v,c,cum)=>{ if(c==null||c<=0) return; const cible=cum? c*P : c; if(cible<=0) return;
      comps.push(Math.min(100, n(v)/cible*100)); };
    add(t.pa,75,false);
    add(t.vgpTaux,100,false);
    add(t.qhpN,12,true);
    add(t.rem, t.remCibleAn,true);
    add(t.vms,12,true);
    add(t.aud,1,true);
    t.avancement = comps.length? comps.reduce((a,b)=>a+b,0)/comps.length : 0;
    t.avancementNb = comps.length;
  })();
  const A=(y.accidents||[]).filter(a=> mIdx==null? true : (new Date(a.date).getMonth()===mIdx));
  t.nbEvt=A.length;
  t.analTaux = A.length? A.filter(a=>a.analyse==="Terminée").length/A.length*100 : 0;
  return t;
}

function rolling12Last(year){
  const ch=[]; YEARS.forEach(yy=>{ if(DB.years[yy]) DB.years[yy].months.forEach((m,i)=>ch.push({y:yy,i:i,d:m})); });
  let last=-1; ch.forEach((p,k)=>{ if(p.y===year&&(n(p.d.h)>0||n(p.d.eff)>0)) last=k; });
  if(last<0) return {tf1:0,tf2:0,tg:0};
  const w=ch.slice(Math.max(0,last-11),last+1);
  return rates(sum(w,z=>z.d.h),sum(w,z=>z.d.ataa),sum(w,z=>z.d.atsa),sum(w,z=>z.d.jours));
}
function monthlySeries(year){

function trimestreCourant(){
  const d=new Date();
  if(d.getFullYear()!==STATE.year) return null;
  return "T"+(Math.floor(d.getMonth()/3)+1);
}
/* Dernier trimestre CLOS de l'exercice affiché.
   Un trimestre en cours n'est jamais considéré comme terminé : en août 2026,
   le dernier trimestre clos est T2, pas T3. */
function trimestreClos(year){
  const d=new Date(), cy=d.getFullYear();
  year = year==null? STATE.year : year;
  if(year<cy) return "T4";          // exercice clos
  if(year>cy) return null;          // exercice à venir
  const q=Math.floor(d.getMonth()/3)+1;
  return q>1 ? "T"+(q-1) : null;    // T1 en cours : aucun trimestre clos sur l'exercice
}
/* Trimestre sur lequel porte l'analyse : celui choisi par l'utilisateur,
   sinon le dernier trimestre clos. */
function trimestreAnalyse(year){
  return STATE.qana || trimestreClos(year);
}

      <option value=""${STATE.qana?"":" selected"}>Auto${auto?" ("+auto+")":""}</option>

}

function niceScale(max,prefInt){
  if(!(max>0)) return {max:1,ticks:[0,1],dec:0};
  const raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), nz=raw/mag;
  let step=(nz<=1?1:nz<=2?2:nz<=2.5?2.5:nz<=5?5:10)*mag;
  if(prefInt&&step<1) step=1;
  const top=Math.ceil(max/step)*step, ticks=[];
  for(let v=0;v<=top+step/1e6;v+=step) ticks.push(+v.toFixed(6));
  return {max:top,ticks:ticks,dec:step>=1?0:(step>=.1?1:2)};
}
function gauge(valPct,label,sub,cls,txt){

  const s=sv("svg",{viewBox:"0 0 100 100",class:"gauge"});
  s.appendChild(sv("circle",{cx:50,cy:50,r:42,class:"gbg"}));
  s.appendChild(sv("circle",{cx:50,cy:50,r:42,class:"gfg "+(cls||"c-neutre"),"stroke-dasharray":(C*v/100)+" "+C}));
  const t=sv("text",{x:50,y:52,"text-anchor":"middle","font-size":"25"}); t.textContent=(txt!=null?txt:Math.round(v)+"%"); s.appendChild(t);
  if(sub){ const t2=sv("text",{x:50,y:68,"text-anchor":"middle","font-size":"10","font-weight":"500",style:"fill:#6b7a8d"}); t2.textContent=sub; s.appendChild(t2); }

}

function barChart(o){
  const {labels,series,height=210,target=null,targetLabel="",directLabels=true,unit="",fmtV=(v)=>fmt(v,0),highlight=null}=o;
  const W=Math.max(340,labels.length*(26*series.length+18)+60),H=height,PL=44,PR=14,PT=18,PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  let raw=0,ai=true; series.forEach(s=>s.values.forEach(v=>{ if(n(v)>raw)raw=n(v); if(n(v)%1!==0)ai=false; }));
  if(target!=null&&target>raw) raw=target;
  const sc=niceScale(raw*1.05,ai), max=sc.max;
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",height:H,preserveAspectRatio:"xMinYMid meet",role:"img"});
  const grp=iw/labels.length;
  if(highlight!=null&&highlight>=0) svg.appendChild(sv("rect",{x:PL+grp*highlight,y:PT-6,width:grp,height:ih+8,fill:"#fff3dd",rx:5}));
  const g=sv("g",{class:"grid"});
  sc.ticks.forEach(yv=>{ const yy=PT+ih-ih*yv/max;
    g.appendChild(sv("line",{x1:PL,x2:W-PR,y1:yy,y2:yy}));
    const t=sv("text",{x:PL-6,y:yy+3.5,"text-anchor":"end"}); t.textContent=fmt(yv,sc.dec); g.appendChild(t); });
  svg.appendChild(g);
  const bw=Math.min(24,iw/labels.length/series.length-3);
  labels.forEach((lab,i)=>{
    const cx=PL+grp*i+grp/2, tw=bw*series.length+2*(series.length-1);

/* Part de l'exercice écoulée, en mois révolus (0 → 1) */
function prorata(year){
  const now=new Date(), cy=now.getFullYear();
  if(year<cy) return 1;
  if(year>cy) return 0;
  return Math.max(1/12, now.getMonth()/12);
}
function cibleADate(cibleAn,year){ return n(cibleAn)*prorata(year); }
/* Statut d'un indicateur.
   sens "max"   : ne pas dépasser (0 AT, 0 NC) — pas de temporalité
   sens "min"   : niveau à atteindre (taux de couverture, %) — pas de temporalité
   sens "cumul" : objectif annuel cumulatif (QHP, remontées, VMS…) — comparé à la cible PRORATISÉE

   DOSAGE DES COULEURS (v10) — le rouge est un signal, pas un décor :
   · sens "max"  : cible tenue → vert ; cible dépassée → ORANGE par défaut.
                   Le rouge n'apparaît que si un seuil d'alerte {rouge:x} est déclaré
                   ET franchi (ex. AT avec arrêt : rouge au-dessus d'1 AT).
                   Les indicateurs mécaniquement dérivés d'un AT (TF1, TF2, TG,
                   journées d'arrêt) n'ont pas de seuil rouge : ils restent orange.
   · sens "min"  : un seuil vert {vert:x} peut être déclaré en dessous de la cible
                   (ex. SST : cible 50 %, mais vert dès 33 % de l'effectif formé).
                   Sinon vert à 100 % de la cible, orange dès 60 %, rouge en dessous. */
function statutDe(val,cible,sens,year,opt){
  opt=opt||{};
  if(!sens||cible==null) return "";
  const v=n(val);
  if(sens==="max"){
    if(v<=n(cible)) return "good";
    return (opt.rouge!=null && v>n(opt.rouge)) ? "bad" : "mid";
  }
  if(!v) return "nd";
  if(opt.vert!=null && v>=n(opt.vert)) return "good";
  let c=n(cible);
  if(sens==="cumul"){ c=cibleADate(cible, year==null?STATE.year:year); if(c<=0) return "good"; }
  if(c<=0) return "good";
  const r=v/c;
  return r>=1?"good":(r>=.6?"mid":"bad");
}
/* Seuils d'alerte rouge, déclarés une seule fois et réutilisés partout */
const RG_AT   = {rouge:1};   // au-dessus d'1 AT → rouge
const RG_ATSA = {rouge:2};
const RG_NC   = {rouge:3};
const V_SST   = {vert:33};   // formation SST : vert dès 33 % de l'effectif
/* Libellé « à date » pour un objectif cumulatif */
function aDate(cibleAn,year){
  const p=prorata(year==null?STATE.year:year);
  if(p>=1) return "cible "+fmt(cibleAn,0)+" / an";
  return "à date : "+fmt(cibleADate(cibleAn,year),0)+" sur "+fmt(cibleAn,0)+" / an";
}

}
function kpi(lab,val,sub,st){
  const cls=st==="good"?"good":st==="mid"?"mid":st==="bad"?"bad":"";
  return `<div class="kpi ${cls}">${st?`<span class="pic">${picto(st,20)}</span>`:""}
    <div class="l">${lab}</div><div class="v">${val}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;
}
function delta(cur,prev){
  if(prev==null||!isFinite(prev)) return "";
  const d=n(cur)-n(prev);
  if(Math.abs(d)<0.05) return `<span class="delta flat">= vs N-1</span>`;
  return `<span class="delta ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${fmt(Math.abs(d),Math.abs(d)<10?1:0)} vs N-1</span>`;
}
function joursRestants(iso){ if(!iso) return null; const d=new Date(iso); if(isNaN(d)) return null; return Math.round((d-new Date())/86400000); }

/* Recalcule le pied de tableau sans reconstruire la page (le focus est conservé) */
function refreshFoot(card,cols){
  const t=yearTotals(STATE.year), y=Y();
  const tds=card.querySelectorAll("tfoot td");
  cols.forEach((cc,k)=>{
    let v; if(cc[0]==="eff") v=fmt(t.eff,1); else if(cc[0]==="etpI") v=fmt(t.etpI,2); else if(cc[0]==="pa") v=fmt(t.pa,0);
    else v=fmt(sum(y.months,m=>m[cc[0]]),cc[2]);
    if(tds[k+1]) tds[k+1].textContent=v;
  });
}

function bodyMap(counts){
  let max=0; Object.values(counts).forEach(v=>{ if(v>max)max=v; }); max=max||1;
  const SIL='<path d="M120 5 c15 0 25 12 25 29 c0 11 -5 21 -12 26 l0 6 c20 3 34 11 39 22 l0 85 c0 8 -12 8 -12 0 l0 -60 l-5 0 l0 76 c0 6 -3 9 -3 16 l0 88 c0 9 -13 9 -13 0 l0 -82 l-8 0 l0 82 c0 9 -13 9 -13 0 l0 -88 c0 -7 -3 -10 -3 -16 l0 -76 l-5 0 l0 60 c0 8 -12 8 -12 0 l0 -85 c5 -11 19 -19 39 -22 z" fill="#f4f7fb" stroke="#cfdae7" stroke-width="1.2"/>';
  let sh=SIL;
  ZONES.forEach(z=>{
    const c=counts[z.k]||0, op=c? (.3+.6*c/max):0;
    const fill=c? `fill:rgba(208,59,59,${op.toFixed(2)});stroke:#b02c2c;` : "";
    const sel=STATE.zone===z.k? " hit":"";
    sh+=`<g class="bz${sel}" style="${fill}" data-z="${esc(z.k)}"><title>${esc(z.k)}${c?" — "+c+" lésion(s)":""}</title>${z.s}</g>`;
    if(z.lab) sh+=`<text x="${z.lx}" y="${z.ly}" text-anchor="middle" font-size="10" style="fill:#1b4f8f" font-weight="700" pointer-events="none">${z.lab}</text>`;
  });
  return `<svg viewBox="0 0 240 372" width="100%" style="max-width:250px;height:auto" role="img" aria-label="Localisation des lésions">${sh}</svg>`;
}
function countBy(list,key){
  const m={}; list.forEach(a=>{ const k=a[key]||"— non renseigné"; m[k]=(m[k]||0)+1; });
  return Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>({k:k,v:m[k]}));
}

/* ============================== SYNC / API ============================== */
let pushTimer=null;
function setSync(s,m){ STATE.sync={state:s,msg:m||STATE.sync.msg};
  const d=document.getElementById("syncDot"); if(d) d.className="dot "+(s==="ok"?"ok":s==="err"?"err":s==="busy"?"warn":""); }
function queuePush(){ if(LECTURE) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>syncPush(true),1500); }
async function api(action,payload){
  const url=DB.settings.webhook; if(!url) throw new Error("Aucun webhook configuré.");
  const body=JSON.stringify(Object.assign({action:action,pass:DB.settings.pass||"",device:DB.settings.device||""},payload||{}));
  const r=await fetch(url,{method:"POST",body:body,redirect:"follow"});
  const txt=await r.text(); let j;
  try{ j=JSON.parse(txt); }catch(e){ throw new Error("Réponse inattendue : "+txt.slice(0,110)); }
  if(!j.ok) throw new Error(j.error||"Erreur serveur");
  return j;
}
async function syncPull(silent,force){
  try{ setSync("busy","Récupération…"); const j=await api("pull");
    /* Garde-fou anti-écrasement : si ce poste a été modifié APRÈS le dernier
       envoi au classeur partagé, une récupération détruirait ce travail.
       On suspend et on laisse l'utilisateur trancher. */
    const loc=(DB.meta&&DB.meta.updatedAt)||"", dist=j.updatedAt||"";
    if(!force && !VIERGE && loc && dist && loc>dist){
      CONFLIT={loc:loc,dist:dist};
      setSync("err","Ce poste est en avance sur le classeur partagé");
      render(); if(!silent) toast("Récupération suspendue : vos données locales sont plus récentes.");
      return;
    }
    CONFLIT=null;
    if(j.data&&j.data.years){ DB=deepMerge(DB,j.data); migrate(); lsSet(STORE_KEY,JSON.stringify(DB)); }
    PULL_OK=true; VIERGE=false;
    setSync("ok","Synchronisé à "+new Date().toLocaleTimeString("fr-FR"));
    if(!silent){ render(); toast("Données récupérées"); } else render();
  }catch(e){ setSync("err",e.message); if(!silent) toast("Synchronisation impossible : "+e.message); }
}
async function syncPush(silent){
  if(LECTURE){ if(!silent) toast("Lien en lecture seule : envoi désactivé"); return; }
  if(VIERGE && !PULL_OK){
    setSync("err","Envoi bloqué : données non récupérées");
    toast("Envoi bloqué — ce navigateur n'a pas encore récupéré les données du classeur partagé.");
    return;
  }
  try{ setSync("busy","Envoi…"); await api("push",{data:DB}); setSync("ok","Enregistré sur le classeur partagé"); if(!silent) toast("Données envoyées"); }
  catch(e){ setSync("err",e.message); if(!silent) toast("Envoi impossible : "+e.message); }
}
async function syncNow(){
  if(!DB.settings.webhook){ STATE.tab="set"; render(); toast("Renseignez d'abord le webhook dans les Réglages"); return; }
  await syncPull(true); await syncPush(true); render(); toast(STATE.sync.msg);
}

  },0);
  return app;
}

/* ================================ RENDER ================================ */
const TABS=[
  {id:"dash",lab:"Tableau de bord",ic:"📊"},
  {id:"saisie",lab:"Saisie",ic:"✍️"},
  {id:"obj",lab:"Objectifs SSE",ic:"🎯"},
  {id:"comp",lab:"Comparaison",ic:"📈"},
  {id:"bul",lab:"Bulletin",ic:"📰"},
  {id:"set",lab:"Réglages",ic:"⚙️"}
];
/* Bandeau d'avertissement sur l'état de la sauvegarde.
   Deux situations méritent d'être dites en grand, pas dans une pastille :
   - aucun webhook : les données ne vivent que dans ce navigateur ;
   - navigateur neuf dont la récupération a échoué : ce qui est affiché est le
     modèle de départ, pas le travail réel, et l'envoi est bloqué. */
function bandeauSync(){
  if(CONFLIT){
    const d=v=>{ try{ return new Date(v).toLocaleString("fr-FR"); }catch(e){ return v; } };
    const n=el(`<div class="note danger"><b>⚠ Ce poste est en avance sur le classeur partagé</b>
      Vos données locales datent du <b>${d(CONFLIT.loc)}</b>, celles du classeur du <b>${d(CONFLIT.dist)}</b>.
      La récupération a été suspendue pour ne pas écraser votre travail. Choisissez :
      <div class="row" style="margin-top:8px">
        <button class="btn btn-primary" id="cfPush">⬆ Envoyer mes données vers le classeur</button>
        <button class="btn btn-ghost" id="cfPull">⬇ Récupérer quand même (mes modifications locales seront perdues)</button>
      </div></div>`);
    setTimeout(()=>{
      const a=document.getElementById("cfPush"); if(a) a.onclick=()=>{ CONFLIT=null; syncPush(false).then(render); };
      const b=document.getElementById("cfPull"); if(b) b.onclick=()=>{
        if(confirm("Récupérer les données du classeur partagé et perdre définitivement les modifications faites sur ce poste ?")){
          CONFLIT=null; syncPull(false,true); } };
    },0);
    return n;
  }
  if(!DB.settings.webhook){
    return el(`<div class="note danger"><b>⚠ Aucune synchronisation — vos données ne vivent que dans ce navigateur</b>
      Elles ne sont enregistrées sur aucun serveur : un autre poste, une autre adresse ou un nettoyage du navigateur
      ne les verra pas ou les perdra. Branchez le webhook dans l'onglet Réglages${LECTURE?"":", ou téléchargez une sauvegarde"}.</div>`);
  }
  if(VIERGE && !PULL_OK){
    return el(`<div class="note danger"><b>⚠ Données non récupérées — ce que vous voyez n'est pas à jour</b>
      Ce navigateur n'a encore jamais reçu les données du classeur partagé : l'écran affiche le modèle de départ.
      L'envoi est bloqué tant que la récupération n'a pas abouti. ${LECTURE?"Rechargez la page dans un instant.":"Réglages → ⬇ Récupérer."}</div>`);
  }
  return null;
}
function render(){
  const sy=window.scrollY;
  document.body.classList.toggle("edit",STATE.edit);
  document.getElementById("hlogo").innerHTML=logoHTML(30);
  const ys=document.getElementById("yearsel");
  ys.innerHTML=YEARS.map(v=>`<button data-y="${v}" aria-pressed="${v===STATE.year}">${v}</button>`).join("");
  ys.querySelectorAll("button").forEach(b=> b.onclick=()=>{ STATE.year=+b.dataset.y; STATE.zone=null; render(); });
  const msel=document.getElementById("moissel");
  msel.innerHTML=`<option value="">Année entière</option>`+MOIS.map((m,i)=>`<option value="${i}"${STATE.mois===i?" selected":""}>${m}</option>`).join("");
  msel.onchange=e=>{ STATE.mois = e.target.value===""? null : +e.target.value; render(); };
  const tb=document.getElementById("tabs");
  const vus=TABS.filter(t=> !(LECTURE && t.id==="set"));
  if(LECTURE && STATE.tab==="set") STATE.tab="dash";
  tb.innerHTML=vus.map(t=>`<button role="tab" data-t="${t.id}" class="${t.id===STATE.tab?"on":""}"><span class="ic">${t.ic}</span>${t.lab}</button>`).join("");
  tb.querySelectorAll("button").forEach(b=> b.onclick=()=>{ STATE.tab=b.dataset.t; render(); scrollTo(0,0); });
  const bm=document.getElementById("btnMode");
  if(LECTURE){ bm.style.display="none"; document.getElementById("btnSync").style.display="none";
    if(!document.getElementById("roBadge")){
      const bg=document.createElement("span"); bg.id="roBadge";
      bg.style.cssText="background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:10px;font-weight:700;font-size:13px";
      bg.textContent="👁 Lecture seule"; document.querySelector("header").appendChild(bg); }
  } else { bm.textContent=STATE.edit?"✏️ Édition":"🔒 Consultation"; bm.classList.toggle("on",STATE.edit); }
  const app=document.getElementById("app"); app.innerHTML="";
  const alerte=bandeauSync(); if(alerte) app.appendChild(alerte);
  app.appendChild(({dash:viewDash,saisie:viewSaisie,obj:viewObj,comp:viewComp,bul:viewBul,set:viewSet}[STATE.tab]||viewDash)());
  setSync(STATE.sync.state);
  if(sy>0) window.scrollTo(0,sy);
}
document.getElementById("btnMode").onclick=()=>{ STATE.edit=!STATE.edit; render(); toast(STATE.edit?"Mode édition activé":"Mode consultation"); };
document.getElementById("btnSync").onclick=syncNow;
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") e.target.classList.remove("open"); };
document.getElementById("vClose").onclick=()=>document.getElementById("viewer").classList.remove("open");
document.getElementById("vIn").onclick=()=>zoomViewer(1.35);
document.getElementById("vOut").onclick=()=>zoomViewer(1/1.35);
document.getElementById("vFit").onclick=()=>zoomViewer(0);
document.getElementById("vImg").onclick=()=>zoomViewer(1.35);
(function dragStage(){
  const st=document.getElementById("vStage"); let d=false,sx=0,sy=0,sl=0,stp=0;
  st.addEventListener("mousedown",e=>{ d=true; st.classList.add("drag"); sx=e.clientX; sy=e.clientY; sl=st.scrollLeft; stp=st.scrollTop; e.preventDefault(); });
  addEventListener("mousemove",e=>{ if(!d) return; st.scrollLeft=sl-(e.clientX-sx); st.scrollTop=stp-(e.clientY-sy); });
  addEventListener("mouseup",()=>{ d=false; st.classList.remove("drag"); });
})();
addEventListener("keydown",e=>{ if(e.key==="Escape"){ document.getElementById("modal").classList.remove("open"); document.getElementById("viewer").classList.remove("open"); } });
(function init(){
  if(LECTURE) STATE.edit=false;
  const cy=new Date().getFullYear(); if(YEARS.indexOf(cy)>=0) STATE.year=cy;
  render();
  if(DB.settings.webhook&&DB.settings.autoSync) syncPull(false);
})();
</script>
